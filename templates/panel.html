        <form action="{{ url_for('agregar') }}" method="POST">
            <label for="nombre">Nombre del producto</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej. Perfume Sauvage">

            <label for="precio">Precio ($ MXN)</label>
            <input type="number" step="0.01" id="precio" name="precio" required placeholder="Ej. 350.00">

            <label for="descripcion">Descripción corta</label>
            <textarea id="descripcion" name="descripcion" rows="2" placeholder="Detalles..."></textarea>

            <label for="imagen">Enlace web de la foto (URL)</label>
            <input type="text" id="imagen" name="imagen" placeholder="Pega aquí el enlace de la imagen">

            <button type="submit" class="btn-submit">Guardar Producto</button>
        </form>
